<head>

<style>
:root{--bg:#0b1220;--panel:#111b2d;--panel2:#172338;--line:#26344b;--text:#edf3fc;--muted:#8fa2bd;--blue:#76a9ff;--cyan:#5eead4;--green:#50d8a0;--yellow:#ffd166;--red:#ff7b87;--shadow:0 22px 65px #0003}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 10% -15%,#1d3962 0,transparent 42%),var(--bg);color:var(--text);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.muted{color:var(--muted)}.app{min-height:100vh}.top{height:76px;border-bottom:1px solid #26344b99;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(18px,4vw,54px);position:sticky;top:0;background:#0b1220e8;backdrop-filter:blur(16px);z-index:10}.brand{display:flex;align-items:center;gap:12px}.brandmark{width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,#73a7ff,#61e6cf);display:grid;place-items:center;color:#091522;font-size:19px;font-weight:900;box-shadow:0 8px 26px #5eead426}.brand b{display:block;font-size:15px;letter-spacing:.03em}.brand small{color:var(--muted);font-size:11px}.topright{display:flex;align-items:center;gap:12px}.pill{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel);padding:8px 12px;border-radius:999px;color:var(--text);font-size:12px}.dot{width:7px;height:7px;border-radius:50%;background:var(--green)}.btn{border:1px solid var(--line);border-radius:11px;padding:10px 14px;background:var(--panel2);color:var(--text);font-weight:650}.btn:hover{filter:brightness(1.12)}.btn.primary{background:linear-gradient(135deg,#7daaff,#5be1ce);border:0;color:#071323}.btn.ghost{background:transparent}.btn.danger{color:var(--red)}.main{max-width:1450px;margin:auto;padding:32px clamp(16px,4vw,54px) 60px}.eyebrow{color:var(--cyan);font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:28px}.hero h1{font-size:clamp(27px,3vw,42px);letter-spacing:-.045em;line-height:1.1;margin:8px 0 10px}.hero p{color:var(--muted);margin:0;max-width:650px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:27px}.stat{padding:18px;border:1px solid var(--line);border-radius:17px;background:linear-gradient(145deg,#152239,#0f1828);box-shadow:0 8px 28px #00000012}.stat .label{color:var(--muted);font-size:12px}.stat strong{font-size:27px;display:block;margin:8px 0 2px;letter-spacing:-.04em}.stat small{font-size:11px;color:var(--muted)}.staticon{float:right;color:var(--blue);font-size:19px}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:14px;margin:28px 0 15px}.sectionhead h2{font-size:17px;margin:0}.sectionhead p{font-size:12px;color:var(--muted);margin:4px 0 0}.building-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.building{border:1px solid var(--line);background:linear-gradient(145deg,#131f33,#0f1726);border-radius:20px;overflow:hidden;transition:.2s transform,.2s border-color;cursor:pointer;min-width:0}.building:hover{transform:translateY(-3px);border-color:#5c83bd}.building.active{border-color:var(--blue)}.buildhead{display:flex;justify-content:space-between;align-items:center;padding:17px 18px 0}.blocklabel{display:flex;align-items:center;gap:10px}.letter{height:36px;width:36px;border-radius:12px;background:linear-gradient(145deg,#2c4a75,#1a2d48);border:1px solid #43648e;display:grid;place-items:center;font-weight:900;font-size:17px}.blocklabel b{font-size:15px}.blocklabel small{display:block;color:var(--muted);font-size:11px;margin-top:2px}.status-chip{border-radius:999px;font-size:10px;padding:5px 8px;background:#1d392f;color:var(--green);border:1px solid #2b5947}.status-chip.issue{background:#40232b;color:var(--red);border-color:#68323b}.model{height:220px;position:relative;display:grid;place-items:center;overflow:hidden;background:radial-gradient(ellipse at 50% 66%,#26466a55,transparent 57%),linear-gradient(180deg,#111c2d,#0f1928)}.model:before{content:"";position:absolute;inset:0;background-image:linear-gradient(#31445b22 1px,transparent 1px),linear-gradient(90deg,#31445b22 1px,transparent 1px);background-size:22px 22px;mask-image:linear-gradient(transparent,#000)}.tower{position:relative;width:106px;height:160px;transform:skewY(-8deg) rotateY(-17deg);transform-style:preserve-3d;filter:drop-shadow(12px 17px 10px #0005)}.towerfront{position:absolute;inset:0;background:linear-gradient(90deg,#4e7097,#8eb3d7 45%,#54769d);border:1px solid #9ac5ec88;display:grid;grid-template-rows:repeat(16,1fr);padding:3px;gap:2px}.towerfront span{background:repeating-linear-gradient(90deg,#1c3754 0 7px,#92c9ef 7px 10px,#294968 10px 15px);border-bottom:1px solid #b5d8f155}.tower-side{position:absolute;top:0;left:100%;width:24px;height:100%;transform-origin:left;transform:skewY(28deg);background:repeating-linear-gradient(180deg,#355475 0 8px,#203c5d 8px 10px);border:1px solid #6287ac}.tower-roof{position:absolute;left:-1px;top:-14px;width:106px;height:15px;background:#b0d3ef;transform:skewX(-48deg);transform-origin:bottom;clip-path:polygon(0 0,100% 0,100% 100%,0 100%)}.model.floorlabel{color:var(--muted)}.model-caption{position:absolute;bottom:11px;left:15px;font-size:10px;color:#9db3ce;letter-spacing:.12em}.model-caption span{color:var(--cyan)}.buildbody{padding:15px 18px 18px}.buildmeta{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:13px}.progresslabel{display:flex;justify-content:space-between;font-size:11px;margin-bottom:7px}.progresslabel b{color:var(--cyan)}.progress{height:6px;border-radius:99px;background:#26354a;overflow:hidden}.progress i{height:100%;display:block;background:linear-gradient(90deg,#628eff,#5eead4);border-radius:99px}.buildfoot{display:flex;justify-content:space-between;align-items:center;margin-top:14px}.microstats{display:flex;gap:12px;color:var(--muted);font-size:11px}.microstats .red{color:var(--red)}.openhint{color:var(--blue);font-size:12px;font-weight:700}.detail-head{display:flex;align-items:center;gap:13px;margin-bottom:20px}.back{width:38px;height:38px;border-radius:12px;background:var(--panel);border:1px solid var(--line);color:var(--text)}.detail-title h1{margin:0;font-size:28px}.detail-title p{margin:4px 0 0;color:var(--muted)}.detail-layout{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(280px,.75fr);gap:17px}.panel{background:linear-gradient(145deg,#131f33,#101827);border:1px solid var(--line);border-radius:18px;padding:19px;min-width:0}.panel h3{margin:0 0 4px;font-size:15px}.panel .sub{color:var(--muted);font-size:12px;margin-bottom:17px}.large-model{height:360px;display:grid;place-items:center;border-radius:14px;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 70%,#24486b88,transparent 60%),linear-gradient(180deg,#101a2a,#0d1522);border:1px solid #26374c}.large-model .tower{transform:scale(1.55) skewY(-8deg) rotateY(-17deg)}.model-tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.floorgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.floor{padding:12px 6px;background:#162339;border:1px solid #2b3c55;border-radius:11px;text-align:center;color:var(--text)}.floor:hover{border-color:var(--blue)}.floor b{display:block;font-size:14px}.floor small{display:block;color:var(--muted);font-size:10px;margin-top:4px}.floor.selected{border-color:var(--cyan);background:#123139}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.section-list{display:grid;gap:10px}.task{border:1px solid var(--line);border-radius:13px;padding:13px;background:#111c2c}.tasktop{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.task h4{margin:0 0 5px;font-size:13px}.task p{margin:0;color:var(--muted);font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere}.task select{max-width:160px;padding:7px 8px}.taskmeta{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:12px}.taskmeta small{color:var(--muted);font-size:10px}.formrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:grid;gap:6px;margin-bottom:12px}.field label{font-size:11px;color:var(--muted)}.field input,.field select,.field textarea{width:100%;border:1px solid #30425c;background:#0c1523;color:var(--text);padding:11px 12px;border-radius:10px;outline:none}.field textarea{min-height:80px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue)}.notice{padding:12px;border-radius:11px;border:1px solid #2c4c69;background:#12263b;color:#b8d6f3;font-size:12px;margin-bottom:14px}.notice.error{border-color:#71343d;background:#351c24;color:#ffb6be}.login-wrap{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) minmax(340px,.7fr)}.login-art{padding:clamp(30px,7vw,100px);display:flex;flex-direction:column;justify-content:center;background:radial-gradient(ellipse at 50% 65%,#244d73,transparent 55%),linear-gradient(135deg,#101c2e,#0b1220);border-right:1px solid var(--line);position:relative;overflow:hidden}.login-art h1{font-size:clamp(34px,4vw,56px);line-height:1.03;letter-spacing:-.05em;margin:20px 0}.login-art p{color:var(--muted);max-width:440px}.login-visual{height:280px;display:flex;align-items:center;justify-content:center;gap:14px;perspective:700px}.login-visual .tower{transform:scale(.85) skewY(-8deg) rotateY(-17deg)}.login-visual .tower:nth-child(2){transform:scale(1.1) skewY(-8deg) rotateY(-17deg)}.login-visual .tower:nth-child(3){transform:scale(.75) skewY(-8deg) rotateY(-17deg)}.login-form-wrap{display:grid;place-items:center;padding:28px}.login-form{width:min(100%,390px)}.login-form h2{font-size:25px;margin:0 0 8px}.login-form>p{color:var(--muted);margin:0 0 24px}.login-form .field{margin-bottom:15px}.login-form .btn{width:100%;margin-top:5px;padding:13px}.login-foot{margin-top:22px;color:var(--muted);font-size:11px}.toast{position:fixed;right:20px;bottom:20px;max-width:360px;padding:13px 16px;border:1px solid var(--line);background:#17263a;border-radius:13px;box-shadow:var(--shadow);z-index:99}.modal-back{position:fixed;inset:0;background:#030812c9;display:grid;place-items:center;padding:16px;z-index:50}.modal{width:min(100%,560px);max-height:90vh;overflow:auto;background:#111b2d;border:1px solid var(--line);border-radius:19px;padding:22px;box-shadow:var(--shadow)}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modalhead h2{font-size:18px;margin:0}.audit-list{display:grid;gap:8px}.audit-item{padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:12px}.audit-item small{display:block;color:var(--muted);margin-top:4px}.empty{border:1px dashed #34445b;border-radius:13px;padding:25px;text-align:center;color:var(--muted);font-size:12px}.footer{color:#687c99;text-align:center;font-size:11px;margin-top:30px}.mobile-menu{display:none}
@media(max-width:1000px){.building-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.detail-layout{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.login-wrap{grid-template-columns:1fr}.login-art{display:none}.login-form-wrap{min-height:100vh}}@media(max-width:600px){.top{height:65px;padding:0 15px}.brandmark{width:35px;height:35px}.brand b{font-size:13px}.topright .pill{display:none}.main{padding:23px 14px 40px}.hero{display:block}.hero .btn{margin-top:16px}.stats{gap:9px}.stat{padding:14px}.stat strong{font-size:23px}.building-grid{grid-template-columns:1fr}.model{height:210px}.detail-title h1{font-size:23px}.large-model{height:290px}.floorgrid{grid-template-columns:repeat(4,minmax(0,1fr))}.panel{padding:14px}.formrow{grid-template-columns:1fr}.tasktop{display:block}.tasktop select{margin-top:10px;width:100%;max-width:none}.hero h1{font-size:30px}}

</head><body>
<div id="app" class="app"><div style="padding:40px;color:#9db3ce">Ilova yuklanmoqda…</div></div>
<div id="toast" class="toast hidden" role="status"></div><div id="modalroot"></div>
<script>
const $=s=>document.querySelector(s); const app=$('#app'); let currentUser=null, currentBlock=null, dashboardData=null, selectedFloor=1, sections=[];
const blockColors={A:'#79aaff',B:'#5eead4',C:'#b3a0ff',D:'#ffd166',E:'#ff9da8'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url,options={}){const res=await fetch(url,{credentials:'same-origin',headers:{'Content-Type':'application/json',...(options.headers||{})},...options});let data={};try{data=await res.json()}catch{}if(!res.ok)throw new Error(data.error||`Server xatosi (${res.status})`);return data}
function toast(message,error=false){const el=$('#toast');el.textContent=message;el.classList.remove('hidden');el.style.borderColor=error?'#71343d':'#2b5947';el.style.color=error?'#ffb6be':'#b4f5d8';clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.add('hidden'),3500)}
function towerMarkup(){return `<div class="tower"><div class="tower-roof"></div><div class="towerfront">${Array.from({length:16},()=>'<span></span>').join('')}</div><div class="tower-side"></div></div>`}
function shell(content){return `<header class="top"><div class="brand"><div class="brandmark">Q</div><div><b>QURILISH <span style="color:var(--cyan)">OS</span></b><small>PROJECT CONTROL SYSTEM</small></div></div><div class="topright"><span class="pill"><i class="dot"></i> Tizim onlayn</span><span class="pill">${esc(currentUser.display_name)} · ${currentUser.role==='admin'?'Bosh direktor':currentUser.role==='prorab'?currentUser.block_code+' blok prarabi':'Kuzatuvchi'}</span><button class="btn ghost" id="logoutBtn">Chiqish ↗</button></div></header>${content}`}
function loginView(message=''){app.innerHTML=`<div class="login-wrap"><section class="login-art"><div class="eyebrow">CONSTRUCTION MANAGEMENT PLATFORM</div><h1>Besh blok.<br><span style="color:var(--cyan)">Bitta nazorat.</span></h1><p>A, B, C, D va E bloklar uchun yagona boshqaruv maydoni. Qurilish holati, jamoa va loyihani bir joyda kuzating.</p><div class="login-visual">${towerMarkup()}${towerMarkup()}${towerMarkup()}</div><div class="muted" style="font-size:11px">A · B · C · D · E / PROJECT DASHBOARD</div></section><section class="login-form-wrap"><form class="login-form" id="loginForm"><div class="brand" style="margin-bottom:28px"><div class="brandmark">Q</div><div><b>QURILISH OS</b><small> XAVFSIZ KIRISH</small></div></div><h2>Xush kelibsiz</h2><p>Davom etish uchun hisobingizga kiring.</p>${message?`<div class="notice error">${esc(message)}</div>`:''}<div class="field"><label for="username">LOGIN</label><input id="username" name="username" autocomplete="username" required placeholder="admin yoki d_prorab"></div><div class="field"><label for="password">PAROL</label><input id="password" name="password" type="password" autocomplete="current-password" required placeholder="Parolingiz"></div><button class="btn primary" type="submit">Tizimga kirish <span style="float:right">→</span></button><div class="login-foot">Hisoblar birinchi ishga tushishda server tomonidan yaratiladi. Login/parol terminalda ko‘rsatiladi.</div></form></section></div>`;$('#loginForm').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.currentTarget);try{const r=await api('/api/login',{method:'POST',body:JSON.stringify({username:fd.get('username'),password:fd.get('password')})});currentUser=r.user;await renderDashboard()}catch(err){loginView(err.message)}}}
function blockCard(b){const c=blockColors[b.code]||'#79aaff';return `<article class="building" data-block="${b.code}" style="--block-color:${c}"><div class="buildhead"><div class="blocklabel"><div class="letter" style="border-color:${c}66;color:${c}">${b.code}</div><div><b>${esc(b.name)}</b><small>${b.floors} qavat · Qurilish boshqaruvi</small></div></div><span class="status-chip ${b.issue?'issue':''}">${b.issue?b.issue+' muammo':'Monitoring'}</span></div><div class="model">${towerMarkup()}<div class="model-caption">INTERACTIVE MASSING MODEL <span> / ${b.code}-BLOCK</span></div></div><div class="buildbody"><div class="buildmeta"><span>📐 3D maket · qavatlar</span><span>${b.done}/${b.total} bo‘lim</span></div><div class="progresslabel"><span>Bajarilish ko‘rsatkichi</span><b>${b.progress}%</b></div><div class="progress"><i style="width:${b.progress}%"></i></div><div class="buildfoot"><div class="microstats"><span>✓ ${b.done} bajarildi</span><span class="red">! ${b.issue} muammo</span></div><span class="openhint">Blokni ochish ↗</span></div></div></article>`}
async function renderDashboard(){dashboardData=await api('/api/dashboard');const d=dashboardData;const canSeeAll=currentUser.role==='admin'||currentUser.role==='viewer';app.innerHTML=shell(`<main class="main"><div class="hero"><div><div class="eyebrow">BOSH BOSHQARUV PANELI / 2026</div><h1>${canSeeAll?'Barcha bloklar.':'Sizning blok.'}<br><span style="color:var(--cyan)">${canSeeAll?'Bitta boshqaruv markazi.':esc(currentUser.block_code+' blok nazorati.')}</span></h1><p>${canSeeAll?'Beshta binoning umumiy holati, bajarilgan ishlar va muammolarni yagona panelda kuzating.':'Blokingiz bo‘yicha qavatlar, bo‘limlar va qurilish holatini boshqaring.'}</p></div>${currentUser.role==='admin'?'<button class="btn primary" id="addSectionTop">＋ Yangi bo‘lim</button>':''}</div><div class="stats"><div class="stat"><span class="staticon">▦</span><div class="label">Ko‘rinadigan bloklar</div><strong>${d.summary.blocks}<span style="font-size:14px;color:var(--muted)"> / 5</span></strong><small>A–E loyiha portfeli</small></div><div class="stat"><span class="staticon">◫</span><div class="label">Umumiy bo‘limlar</div><strong>${d.summary.sections}</strong><small>Barcha ko‘rinadigan bo‘limlar</small></div><div class="stat"><span class="staticon" style="color:var(--green)">✓</span><div class="label">Bajarilgan ishlar</div><strong>${d.summary.done}</strong><small>Holati tasdiqlangan bo‘limlar</small></div><div class="stat"><span class="staticon" style="color:var(--red)">!</span><div class="label">Muammolar</div><strong>${d.summary.issues}</strong><small>E’tibor talab qiladigan bo‘limlar</small></div></div><div class="sectionhead"><div><h2>Bloklar maketi</h2><p>Binoni tanlab, qavatlar va ishlar tafsilotiga o‘ting.</p></div><span class="pill">⌖ 3D ko‘rinish · prototip</span></div><div class="building-grid">${d.blocks.map(blockCard).join('')}</div>${currentUser.role==='admin'?`<div class="sectionhead"><div><h2>Administrator vositalari</h2><p>Foydalanuvchilar va tizim faoliyati</p></div></div><div class="toolbar"><button class="btn" id="manageUsers">♙ Akkauntlar</button><button class="btn" id="viewAudit">◷ Faoliyat tarixi</button><button class="btn" id="legacyArchives">▣ Eski ma’lumotlar arxivi</button></div>`:''}<div class="footer">QURILISH OS · Ma’lumotlar serverda saqlanadi · Interaktiv 3D ko‘rinish hozircha konseptual maket</div></main>`);$('#logoutBtn').onclick=logout;document.querySelectorAll('[data-block]').forEach(el=>el.onclick=()=>openBlock(el.dataset.block));if($('#addSectionTop'))$('#addSectionTop').onclick=()=>openSectionModal();if($('#manageUsers'))$('#manageUsers').onclick=manageUsers;if($('#viewAudit'))$('#viewAudit').onclick=viewAudit;if($('#legacyArchives'))$('#legacyArchives').onclick=manageLegacyArchives}
async function openBlock(code){try{const d=await api('/api/blocks/'+code);currentBlock=d.block;sections=d.sections;selectedFloor=1;renderBlock()}catch(e){toast(e.message,true)}}
function renderBlock(){const b=currentBlock;const mine=currentUser.role==='admin'||currentUser.role==='prorab'&&currentUser.block_code===b.code;const list=sections.filter(s=>!s.floor_no||Number(s.floor_no)===selectedFloor);app.innerHTML=shell(`<main class="main"><div class="detail-head"><button class="back" id="backBtn">←</button><div class="letter" style="color:${blockColors[b.code]};border-color:${blockColors[b.code]}66">${b.code}</div><div class="detail-title"><h1>${esc(b.name)} <span style="color:var(--cyan)">/ Boshqaruv</span></h1><p>${esc(b.description)} · ${b.floors} qavat</p></div><div style="margin-left:auto">${mine?'<button class="btn primary" id="newSection">＋ Bo‘lim qo‘shish</button>':''}</div></div><div class="detail-layout"><section class="panel"><h3>3D bino maketi</h3><div class="sub">Hozircha konseptual 3D ko‘rinish. Aniq arxitektura modeli alohida BIM/3D fayl asosida ulanadi.</div><div class="large-model">${towerMarkup()}<div class="model-caption">${b.code}-BLOCK · CONCEPT MODEL</div></div><div class="model-tools"><span class="pill">▦ ${b.floors} qavat</span><span class="pill">◫ ${sections.length} bo‘lim</span><span class="pill">◎ ${sections.filter(s=>s.status==='muammo').length} muammo</span></div><div class="sectionhead"><div><h2>Qavatlar bo‘yicha ko‘rish</h2><p>Qavatni tanlang — unga biriktirilgan bo‘limlar pastda ko‘rinadi.</p></div></div><div class="floorgrid">${Array.from({length:b.floors},(_,i)=>i+1).map(f=>`<button class="floor ${selectedFloor===f?'selected':''}" data-floor="${f}"><b>${String(f).padStart(2,'0')}</b><small>${sections.filter(s=>s.floor_no===f).length} bo‘lim</small></button>`).join('')}</div></section><aside class="panel"><h3>Blok ma’lumotlari</h3><div class="sub">Serverdan olingan joriy holat</div><div class="stats" style="grid-template-columns:1fr 1fr;gap:9px"><div class="stat"><div class="label">Jami bo‘lim</div><strong>${sections.length}</strong></div><div class="stat"><div class="label">Bajarilgan</div><strong style="color:var(--green)">${sections.filter(s=>s.status==='bajarildi').length}</strong></div></div><div class="sectionhead"><div><h2>Bo‘limlar</h2><p>${selectedFloor}-qavat va umumiy bo‘limlar</p></div></div><div class="section-list">${list.length?list.map(sectionCard).join(''):'<div class="empty">Bu qavatga bo‘lim biriktirilmagan. Yangi bo‘lim qo‘shishingiz mumkin.</div>'}</div></aside></div><div class="footer">${esc(b.name)} · O‘zgarishlar server bazasida saqlanadi</div></main>`);$('#logoutBtn').onclick=logout;$('#backBtn').onclick=renderDashboard;if($('#newSection'))$('#newSection').onclick=()=>openSectionModal(b.code,selectedFloor);document.querySelectorAll('[data-floor]').forEach(el=>el.onclick=()=>{selectedFloor=Number(el.dataset.floor);renderBlock()});document.querySelectorAll('[data-status]').forEach(el=>el.onchange=()=>updateSection(el.dataset.status,el.value));document.querySelectorAll('[data-editnote]').forEach(el=>el.onclick=()=>editDescription(Number(el.dataset.editnote)))}
const statusNames={rejalashtirilgan:'Rejada',jarayonda:'Jarayonda',bajarildi:'Bajarildi',muammo:'Muammo'};
function sectionCard(s){const canEdit=currentUser.role==='admin'||currentUser.role==='prorab'&&currentUser.block_code===s.block_code;return `<article class="task"><div class="tasktop"><div><h4>${esc(s.title)}</h4><p>${esc(s.category)}${s.floor_no?' · '+s.floor_no+'-qavat':''}</p>${s.description?`<p style="margin-top:7px">${esc(s.description)}</p>`:''}</div>${canEdit?`<select aria-label="Holat" data-status="${s.id}">${Object.entries(statusNames).map(([k,v])=>`<option value="${k}" ${s.status===k?'selected':''}>${v}</option>`).join('')}</select>`:`<span class="status-chip ${s.status==='muammo'?'issue':''}">${statusNames[s.status]||s.status}</span>`}</div><div class="taskmeta"><small>${s.updated_by_name?'Yangilagan: '+esc(s.updated_by_name):'Yangilangan: '+esc(s.updated_at||'')}</small>${canEdit?`<button class="btn ghost" style="padding:6px 9px;font-size:11px" data-editnote="${s.id}">Izohni tahrirlash</button>`:''}</div></article>`}
async function updateSection(id,status){try{await api('/api/sections/'+id,{method:'PATCH',body:JSON.stringify({status})});toast('Holat saqlandi');await openBlock(currentBlock.code)}catch(e){toast(e.message,true);await openBlock(currentBlock.code)}}
async function editDescription(id){const s=sections.find(x=>x.id===id);if(!s)return;modal(`<div class="modalhead"><h2>Izohni tahrirlash</h2><button class="btn ghost" data-close>✕</button></div><form id="editDesc"><div class="field"><label>IZOH</label><textarea name="description" maxlength="2000">${esc(s.description)}</textarea></div><button class="btn primary" type="submit">Saqlash</button></form>`);$('#editDesc').onsubmit=async e=>{e.preventDefault();const description=new FormData(e.currentTarget).get('description');try{await api('/api/sections/'+id,{method:'PATCH',body:JSON.stringify({description})});closeModal();toast('Izoh saqlandi');await openBlock(currentBlock.code)}catch(err){toast(err.message,true)}}}
function openSectionModal(code=currentBlock?.code,floor=selectedFloor){modal(`<div class="modalhead"><h2>Yangi bo‘lim qo‘shish</h2><button class="btn ghost" data-close>✕</button></div><form id="sectionForm"><div class="formrow"><div class="field"><label>BLOK</label><select name="block_code" ${currentUser.role!=='admin'?'disabled':''}>${(currentUser.role==='admin'?['A','B','C','D','E']:[currentUser.block_code]).map(c=>`<option ${c===code?'selected':''}>${c}</option>`).join('')}</select>${currentUser.role!=='admin'?`<input type="hidden" name="block_code" value="${currentUser.block_code}">`:''}</div><div class="field"><label>QAVAT</label><select name="floor_no"><option value="">Umumiy bo‘lim</option>${Array.from({length:16},(_,i)=>i+1).map(f=>`<option value="${f}" ${f===floor?'selected':''}>${f}-qavat</option>`).join('')}</select></div></div><div class="field"><label>BO‘LIM NOMI *</label><input name="title" required minlength="2" maxlength="120" placeholder="Masalan: Eshik va panjara"></div><div class="field"><label>KATEGORIYA</label><select name="category"><option>Qurilish</option><option>Material</option><option>Xonalar</option><option>Elektr</option><option>Santexnika</option><option>Fasad</option><option>Hujjatlar</option><option>Umumiy</option></select></div><div class="field"><label>IZOH</label><textarea name="description" maxlength="2000" placeholder="Vazifa tafsilotlari, mas'ul shaxs va muddat..."></textarea></div><button class="btn primary" type="submit">＋ Bo‘lim yaratish</button></form>`);$('#sectionForm').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.currentTarget);const payload={block_code:fd.get('block_code'),floor_no:fd.get('floor_no')||null,title:fd.get('title'),category:fd.get('category'),description:fd.get('description')};try{await api('/api/blocks/'+payload.block_code+'/sections',{method:'POST',body:JSON.stringify(payload)});closeModal();toast('Yangi bo‘lim yaratildi');if(currentBlock)await openBlock(payload.block_code);else await renderDashboard()}catch(err){toast(err.message,true)}}}
function modal(html){$('#modalroot').innerHTML=`<div class="modal-back" id="modalBack"><div class="modal">${html}</div></div>`;$('#modalBack').addEventListener('click',e=>{if(e.target.id==='modalBack'||e.target.closest('[data-close]'))closeModal()})}function closeModal(){$('#modalroot').innerHTML=''}
async function manageUsers(){try{const users=await api('/api/users');modal(`<div class="modalhead"><h2>Akkauntlar boshqaruvi</h2><button class="btn ghost" data-close>✕</button></div><div class="notice">Dastlabki hisoblar server birinchi ishga tushganda yaratiladi. Yangi akkaunt uchun kuchli, kamida 12 belgili parol belgilang.</div><div class="section-list" style="margin-bottom:20px">${users.map(u=>`<div class="task"><div class="tasktop"><div><h4>${esc(u.display_name)}</h4><p>${esc(u.username)} · ${esc(u.role)}${u.block_code?' · '+u.block_code+' blok':''}</p></div><span class="status-chip">${u.active?'Faol':'Faol emas'}</span></div></div>`).join('')}</div><div class="sectionhead"><div><h2>Yangi akkaunt</h2><p>Yaratilgandan so‘ng loginni foydalanuvchiga xavfsiz yetkazing.</p></div></div><form id="userForm"><div class="formrow"><div class="field"><label>LOGIN</label><input name="username" required minlength="3" maxlength="30" pattern="[a-zA-Z0-9_]+" placeholder="masalan: b_prorab"></div><div class="field"><label>ISMI</label><input name="display_name" required maxlength="100" placeholder="Foydalanuvchi ismi"></div></div><div class="formrow"><div class="field"><label>ROL</label><select name="role" id="newRole"><option value="prorab">Blok prarabi</option><option value="viewer">Kuzatuvchi</option><option value="admin">Administrator</option></select></div><div class="field" id="blockField"><label>BLOK</label><select name="block_code"><option>A</option><option>B</option><option>C</option><option>D</option><option>E</option></select></div></div><div class="field"><label>VAQTINCHALIK PAROL (12+ BELGI)</label><input name="password" type="password" minlength="12" required autocomplete="new-password"></div><button class="btn primary" type="submit">Akkaunt yaratish</button></form>`);$('#newRole').onchange=e=>$('#blockField').classList.toggle('hidden',e.target.value==='admin');$('#userForm').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.currentTarget);const payload=Object.fromEntries(fd);if(payload.role==='admin')payload.block_code=null;try{await api('/api/users',{method:'POST',body:JSON.stringify(payload)});toast('Akkaunt yaratildi');await manageUsers()}catch(err){toast(err.message,true)}}}catch(e){toast(e.message,true)}}
async function viewAudit(){try{const rows=await api('/api/audit');modal(`<div class="modalhead"><h2>Faoliyat tarixi</h2><button class="btn ghost" data-close>✕</button></div><div class="audit-list">${rows.length?rows.map(r=>`<div class="audit-item"><b>${esc(r.display_name||r.username||'Tizim')} · ${esc(r.action)}</b><div>${esc(r.entity_type)} #${esc(r.entity_id)}</div><small>${esc(r.created_at)} · ${esc(r.details)}</small></div>`).join(''):'<div class="empty">Hali tarix yozuvi yo‘q.</div>'}</div>`)}catch(e){toast(e.message,true)}}
async function manageLegacyArchives(){try{const rows=await api('/api/legacy-archives');modal(`<div class="modalhead"><h2>Eski ma’lumotlar arxivi</h2><button class="btn ghost" data-close>✕</button></div><div class="notice">Bu bosqich faqat faylni o‘zgartirmasdan arxivlaydi va SHA-256 nazorat summasini saqlaydi. Bu ma’lumotlar hali A–E ishchi jadvallariga import qilinmaydi.</div><div class="field"><label>ARXIV NOMI</label><input id="archiveName" value="Original C-blok ma’lumoti" maxlength="160"></div><div class="field"><label>JSON FAYL (10 MB gacha)</label><input id="archiveFile" type="file" accept=".json,application/json" required></div><button class="btn primary" id="uploadArchive">Arxivga xavfsiz saqlash</button><div class="sectionhead"><div><h2>Saqlangan arxivlar</h2><p>Fayl nomi, hajmi va nazorat summasi</p></div></div><div class="section-list" id="archiveList">${rows.length?rows.map(a=>`<div class="task"><h4>${esc(a.name)}</h4><p>${esc(a.source_type)} · ${Number(a.byte_length).toLocaleString()} bayt</p><p>SHA-256: ${esc(a.sha256)}</p><div class="taskmeta"><small>${esc(a.created_at)}</small><a class="btn ghost" href="/api/legacy-archives/${a.id}/download">Yuklab olish</a></div></div>`).join(''):'<div class="empty">Hozircha arxiv yo‘q.</div>'}</div><details style="margin-top:16px"><summary>Eski brauzer localStorage ma’lumotini eksport qilish</summary><p class="muted">Eski ilova ochiq turgan brauzerda DevTools Console’ga quyidagi kodni kiriting. Bu ma’lumotni o‘chirmaydi, faqat JSON fayl yuklaydi.</p><pre style="white-space:pre-wrap;overflow-wrap:anywhere;background:#0b1220;padding:12px;border-radius:10px;font-size:11px">const k='bm_c_newsec_v1'; const v=localStorage.getItem(k); if(v===null){alert('Bu kalit topilmadi')}else{const b=new Blob([JSON.stringify({source_key:k,raw_value:v,exported_at:new Date().toISOString()},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='legacy-localstorage-export.json';a.click();URL.revokeObjectURL(a.href)}</pre></details>`);$('#uploadArchive').onclick=async()=>{const file=$('#archiveFile').files[0],name=$('#archiveName').value.trim();if(!file){toast('Avval JSON faylni tanlang',true);return}if(file.size>10*1024*1024){toast('Fayl 10 MB dan kichik bo‘lishi kerak',true);return}try{const rawText=await file.text();JSON.parse(rawText);const result=await api('/api/legacy-archives',{method:'POST',body:JSON.stringify({name:name||file.name,source_type:'json-upload',raw_text:rawText})});toast('Arxiv saqlandi · SHA-256 '+result.sha256.slice(0,12)+'…');await manageLegacyArchives()}catch(e){toast(e.message||'JSON faylni o‘qib bo‘lmadi',true)}}}catch(e){toast(e.message,true)}}
async function logout(){try{await api('/api/logout',{method:'POST',body:'{}'})}catch{}currentUser=null;currentBlock=null;loginView()}
(async()=>{try{const d=await api('/api/me');if(d.user){currentUser=d.user;await renderDashboard()}else loginView()}catch{loginView('Serverga ulanib bo‘lmadi. Server ishga tushganini tekshiring.')}})();
</script></body></html>
